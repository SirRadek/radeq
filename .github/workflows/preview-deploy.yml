name: Preview Deploy to GitHub Pages

# RAD-PREVIEW-001: every web implementation run produces a shareable preview URL.
# Publishes the pushed branch build to GitHub Pages (preview channel only — not
# radeq.cz production, which is served by Cloudflare). URL format:
# https://sirradek.github.io/radeq/?v=<short-commit>

on:
  push:
    branches:
      - 'autopilot/**'
      - 'codex/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install, build, and upload
        uses: withastro/action@v6
        env:
          DEPLOY_TARGET: github-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
