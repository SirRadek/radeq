# radeq decision-mesh rules
# Last reviewed against reality: 2026-07-08 (3-provider governance review — keep / relax / update).
# Habit: when a rule contradicts the running system, UPDATE it. Stale blockers teach future work to route around governance.
rules:
  - id: RAD-OFFER-001
    title: Primary offer is complete websites
    applies_to:
      - offer_positioning_conversion
      - static_public_site
    instruction: "The first public homepage direction must focus on complete websites for small businesses: structure, content, design, implementation, performance/SEO basics, and clear handoff. Do not narrow the primary positioning to WordPress/WooCommerce repairs unless the owner explicitly changes scope."
    severity: blocker
  - id: RAD-OFFER-002
    title: Paid entry product and CTA are owner-locked
    applies_to:
      - offer_positioning_conversion
      - lead_capture_pipeline
    instruction: "The paid entry product is owner-locked: 'Audit webu nebo procesu od 3 000 Kč' — an audit credited toward realization. It is NOT a rychla-oprava/kontrola/fix package (that framing stays forbidden) and NOT the old 'Audit webu s planem' name. The homepage and lead path use this entry product and its CTA. Only a new owner decision may change its price or name."
    severity: blocker
  - id: RAD-OFFER-003
    title: Data and automation are a co-primary pillar
    applies_to:
      - offer_positioning_conversion
      - seo_performance_surface
    instruction: "Data and practical automation are a CO-PRIMARY, high-margin pillar alongside complete websites (per offer_positioning_conversion, re-locked 2026-06-30). Websites/redesigns stay the accessible entry; automation/data are the high-margin path, backed by proof not hype. SEO, PC support, migrations, Shopify/WordPress/WooCommerce and broader custom work remain secondary or implementation-specific. The homepage must still read as a focused triad (weby, data, automatizace), not a do-everything portfolio."
    severity: major
  - id: RAD-OFFER-004
    title: Public effects do not replace positioning
    applies_to:
      - offer_positioning_conversion
      - static_public_site
      - three_d_mascot_addon
    instruction: "A/B/C/D visual variants, demo shop, and 3D mascot are proof or review mechanisms; they must not become the main public decision path on the homepage."
    severity: major
  - id: RAD-OFFER-005
    title: Safety and honesty proof is part of the offer
    applies_to:
      - offer_positioning_conversion
      - lead_capture_pipeline
    instruction: "Public copy must include proof of a safe process — scope clarity, content/SEO structure, technical implementation, testing, performance/accessibility checks, clear handoff — for websites AND for data/automation/AI claims (each backed by a working prototype on demo data, before/after, or honest case notes). Risky recovery, real payment, large migration, or complex ecommerce promises require a separate owner-approved scope. Never promise Google positions, a specific PageSpeed number, or 'zero errors'."
    severity: major
  - id: RAD-STATIC-001
    title: Core content remains static-readable
    applies_to:
      - static_public_site
    instruction: "Do not make primary content, navigation, CTA, or SEO text depend on WebGL or client-only JavaScript."
    severity: blocker
  - id: RAD-LEADS-001
    title: Lead data remains validated and minimized
    applies_to:
      - lead_capture_pipeline
    instruction: "Client and server validation, privacy minimization, and controlled D1 error behavior must remain intact."
    severity: blocker
  - id: RAD-OBS-001
    title: Radeq runtime logs stay project-owned
    applies_to:
      - runtime_observability_boundary
    instruction: "Diagnose Radeq runtime, deployment, client, lead API, SEO, and 3D symptoms inside the Radeq project mesh. Autopilot may record only redacted summaries and source pointers."
    severity: blocker
  - id: RAD-OBS-002
    title: Radeq diagnostics require bounded evidence (risk-tiered)
    applies_to:
      - runtime_observability_boundary
    instruction: "For HIGH-RISK areas (production deploy, lead API, LLM/AI demo, payment/checkout, SEO/performance, production incidents) define symptom, time window, evidence source, baseline metric, suspected layer, reproduction or counterexample, and fix verification before changing Radeq runtime behavior. For small runtime-neutral edits (minor copy/CSS), a short reproduction plus a verification note is sufficient."
    severity: major
  - id: RAD-3D-001
    title: 3D remains optional
    applies_to:
      - three_d_mascot_addon
    instruction: "3D mascot changes require reduced-motion behavior, WebGL fallback, mobile check, cleanup, and asset-license evidence."
    severity: major
  - id: RAD-SEO-001
    title: Speed and SEO are protected
    applies_to:
      - seo_performance_surface
    instruction: "Performance or SEO-impacting changes require measurement or an explicit note that measurement was not available."
    severity: major
  - id: RAD-DESIGN-001
    title: Proposal variants require separate composition logic
    applies_to:
      - static_public_site
      - seo_performance_surface
    instruction: "A/B/C/D proposal variants must differ by first-screen purpose, H1/H2, layout rhythm, section order, visual anchor, CTA logic, proof strategy, and mobile behavior. Palette-only or shared-shell variants are a stop condition."
    severity: blocker
  - id: RAD-DESIGN-002
    title: Public design refinements require mobile evidence (risk-tiered)
    applies_to:
      - static_public_site
      - seo_performance_surface
      - runtime_observability_boundary
    instruction: "Before claiming a PUBLIC visual/UX refinement is ready, record the public preview URL or commit, mobile viewport evidence, overflow state, console state, metadata/indexability state, performance note, and rollback path. For smaller or runtime-neutral changes, a local build plus a targeted mobile check is sufficient."
    severity: major
  - id: RAD-SHOWCASE-001
    title: Public showcases stay prominent but secondary to the offer
    applies_to:
      - public_showcase_examples
      - static_public_site
      - offer_positioning_conversion
    instruction: "The Czech /ukazky hub and detail pages present public-safe demo scenarios (provoz/inquiry/automation/chatbot). They must be PROMINENT and easy to find (a strong nav link plus a homepage proof strip), because for a reference-light owner the demos are the reputation — but they must not replace the complete-website homepage offer or become the primary conversion path, and must not replace or redirect old /demo routes without a separate owner decision."
    severity: major
  - id: RAD-SHOWCASE-002
    title: Chatbot demos — rule-based default, AI only under guardrails
    applies_to:
      - public_showcase_examples
      - lead_capture_pipeline
    instruction: "The default /ukazky/chatbot page stays a static rule-based guide over prepared data (no LLM, RAG, model API, network calls, localStorage, analytics, backend inference, or hidden lead submission). A SEPARATE, clearly-labelled opt-in AI demo (e.g. /ukazky/ai-lab) MAY use a live model ONLY under ALL of: server-side key/proxy (never client-side), Turnstile plus per-IP rate limit, a daily spend/token cap with a kill switch, public toy data only (no private docs, uploads, or lead data), no tools/actions, output screening, prompt-injection defense with a visible security panel, and explicit human handoff. Framing must be honest — it demonstrates DEFENSE and its limits ('ukazka obrany, ne dukaz, ze je AI bezpecna'; per OWASP, controls slow but do not eliminate injection). No 'AI is safe/solved' claims."
    severity: blocker
  - id: RAD-SHOWCASE-003
    title: E-shop showcase — inquiry plus simulated checkout only
    applies_to:
      - public_showcase_examples
      - lead_capture_pipeline
    instruction: "The /ukazky/nabidka-eshop page presents clearer offers and inquiry paths, and MAY include a clearly-labelled SIMULATED checkout (pure UI simulation, or a provider TEST mode such as Stripe test cards, or a mock invoice/QR) that moves no real funds. It must NOT collect real payment credentials, real delivery/billing PII, use live provider keys, or create a binding order."
    severity: blocker
  - id: RAD-EMAIL-001
    title: Fastmail mailbox hosting; DMARC hardens in stages
    applies_to:
      - domain_email_research
      - lead_capture_pipeline
    instruction: "Fastmail is the owner-confirmed human mailbox provider for radeq.cz (siroky@, info@, poptavky@ working). Keep Cloudflare as the DNS/control surface. Move DMARC through a STAGED hardening path (p=none -> quarantine -> reject) once Fastmail + Resend alignment is confirmed via aggregate (rua) reports — do not stay pinned at p=none; also prefer SPF softfail (~all) over neutral (?all). Keep distinguishing mailbox hosting from forwarding, transactional email, and form backend work. Do not change production deploy, lead API, or provider configuration without an explicit owner decision."
    severity: blocker
  - id: RAD-EMAIL-002
    title: Lead notification email is transactional (Resend) and fail-soft
    applies_to:
      - domain_email_research
      - lead_capture_pipeline
    instruction: "The contact form sends a server-side transactional notification via RESEND (api.resend.com/emails with RESEND_API_KEY) only after successful D1 storage, plus a localized visitor auto-confirmation; both are fail-soft and gated by Turnstile plus a rate limit. Email sending failures must be logged WITHOUT exposing lead details or the API key, and must not turn a successfully stored lead into a visitor-facing error. (The old Cloudflare Email Sending binding is retired.)"
    severity: blocker
  - id: RAD-DEPLOY-001
    title: Risk-tiered production deploy with owner approval
    applies_to:
      - static_public_site
      - lead_capture_pipeline
      - runtime_observability_boundary
    instruction: "Radeq production changes are RISK-TIERED. Any production deploy (Cloudflare Worker radeq / production domain) requires explicit owner approval in the current turn, a named target, passing local gates (build, typecheck, tests), a recorded rollback version/commit, and a post-deploy smoke check. Direct 'wrangler deploy' is the normal path for small, reviewed changes; substantial UI or risky backend changes additionally require a GitHub branch plus PR review plus preview before deploy."
    severity: blocker
  - id: RAD-PREVIEW-001
    title: Preview before production, matched to change risk
    applies_to:
      - preview_publishing
      - static_public_site
    instruction: "After a substantial web UI/content implementation run, produce a shareable preview before production. Use a Cloudflare preview environment (wrangler --env preview / Pages preview) for anything touching Worker, D1, Resend, LLM, or runtime behavior — GitHub Pages cannot run those. GitHub Pages preview may be used for purely static UI review. Low-risk runtime-neutral edits (small copy/CSS) need only a local build plus a targeted check, not a full preview ritual. If a required preview fails, report the failure mode and the exact owner action required — do not silently omit it."
    severity: major
