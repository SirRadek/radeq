name = "radeq"
main = "worker/index.ts"
compatibility_date = "2026-06-11"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[[d1_databases]]
binding = "LEADS_DB"
database_name = "LEADS_DB"
database_id = "replace-with-production-d1-database-id"
