id: public_showcase_examples
type: public_content_surface
name: Public showcase examples (demo scenarios)
question: "Do public /ukazky demo scenarios stay Czech-first, public-safe, honest, and prominent-but-secondary to the complete-website homepage offer?"
why: "The owner approved a Czech wave of public-safe demo scenarios for provoz/inquiry, automation, chatbot, and offer/e-shop paths, keeping old /demo routes separate and avoiding fake client evidence. Reviewed 2026-07-08: a guarded opt-in AI demo and a clearly-labelled simulated/test-mode checkout are now allowed under the guardrails in RAD-SHOWCASE-002/003; demos should be prominent, not hidden."
signals:
  - ukazky
  - examples
  - demo
  - chatbot
  - automation
  - offer
  - ecommerce
  - public proof
related_agents:
  - frontend
  - content
  - security
  - seo_performance
  - qa
related_files:
  - src/pages/ukazky/
  - src/data/showcaseExamples.ts
  - src/data/chatbotGuide.ts
required_checks:
  - static_content_readable
  - no_client_or_private_data
  - no_demo_matrix_leakage
  - chatbot_default_rule_based__ai_demo_guarded
  - checkout_simulation_or_test_mode_only
  - explicit_handoff
  - sitemap_entry_check
  - mobile_overflow_check
stop_conditions:
  - showcase_replaces_homepage_offer
  - ai_demo_missing_required_guardrails
  - real_payment_or_pii_in_checkout
  - client_case_study_claim_without_public_evidence
  - demo_routes_redirected_without_owner_decision
objective:
  - "Expose prominent, easy-to-find public proof through /ukazky without changing the homepage's primary complete-website offer."
  - "Keep the default chatbot rule-based over prepared data; allow a separate opt-in AI demo only under the RAD-SHOWCASE-002 guardrails (server-side key, Turnstile + rate limit, spend cap + kill switch, toy data only, injection defense + visible security panel, human handoff, honest 'defense not solved' framing)."
  - "Keep /ukazky/nabidka-eshop as an inquiry/offer path that MAY include a clearly-labelled simulated or test-mode checkout moving no real funds — never real payment credentials, real PII, live keys, or a binding order."
