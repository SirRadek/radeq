name: Clean verified RadeQ Pages
on:
  push:
    branches: [codex/radeq-clean-pages-20261013]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout verified snapshot
        uses: actions/checkout@v6
      - name: Upload complete clean site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy snapshot to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
